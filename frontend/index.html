<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2457c5">
  <title>CheckStock — учёт товаров</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/src/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">К содержимому</a>
  <header class="topbar">
    <a class="brand" href="#inventory" aria-label="CheckStock — остатки">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true"><path d="M4 8 15 2l11 6v14l-11 6-11-6V8Z" stroke="currentColor" stroke-width="2"/><path d="m4 8 11 6 11-6M15 14v14M9 5l11 6" stroke="currentColor" stroke-width="2"/></svg>
      CheckStock
    </a>
    <span id="store-name">Учёт товаров</span>
  </header>
  <nav class="navigation" aria-label="Разделы">
    <a href="#inventory">Остатки</a>
    <a href="#movements">Операции</a>
    <a href="#warehouses">Склады</a>
    <a href="#history">История</a>
  </nav>
  <main id="content" tabindex="-1">
    <div class="page-heading">
      <div><h1 id="page-title">Остатки</h1><p id="page-description">Товар на складах, в резерве и в пути.</p></div>
      <div class="actions"><button id="refresh" type="button">Обновить</button><button id="new-operation" class="primary" type="button" disabled>Новая операция</button></div>
    </div>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <div id="view" aria-busy="true"><p class="empty">Загружаем остатки…</p></div>
    <p id="updated" class="muted update-time"></p>
  </main>
  <dialog id="form-dialog" aria-labelledby="form-title">
    <form id="editor">
      <div class="dialog-heading"><h2 id="form-title"></h2><button type="button" class="close" data-close aria-label="Закрыть форму">×</button></div>
      <fieldset id="form-fields"></fieldset>
      <div id="form-error" class="error" role="alert" hidden></div>
      <div class="dialog-footer"><button type="button" data-close>Отмена</button><button id="save" class="primary" type="submit">Сохранить</button></div>
    </form>
  </dialog>
  <dialog id="detail-dialog" aria-labelledby="detail-title">
    <div class="dialog-heading"><h2 id="detail-title">Операция</h2><button type="button" class="close" data-close aria-label="Закрыть операцию">×</button></div>
    <div id="detail-content"></div>
  </dialog>
  <noscript>Для работы CheckStock включите JavaScript в браузере.</noscript>
</body>
</html>
