[project]
name = "checkstock-api"
version = "0.1.0"
description = "Inventory movements for a single-store fulfillment prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = ["anyio>=4.16,<5", "httpx2>=2,<3", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
anyio_mode = "auto"
filterwarnings = ["error::RuntimeWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async bridge switches greenlets; the tracer must follow those switches.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
fail_under = 90
